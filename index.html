<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actions Panel</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--text:#1f2328;--muted:#656d76;--line:#d0d7de;--accent:#2da44e;--blue:#0969da;--red:#cf222e;--yellow:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--line:#30363d;--accent:#238636;--blue:#58a6ff;--red:#f85149;--yellow:#d29922}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:720px;margin:0 auto}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 8px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-size:15px}
button{cursor:pointer;border:0;background:var(--accent);color:#fff;padding:8px 14px;border-radius:6px;font-size:14px}
button:disabled{opacity:.5}
.big{width:100%;padding:16px;font-size:18px;margin-top:12px;border-radius:10px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.small{font-size:12px;color:var(--muted)}
a{color:var(--blue);text-decoration:none}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.success{color:var(--accent)}.failure{color:var(--red)}.progress{color:var(--yellow)}
#msg{font-size:13px;min-height:18px;margin-bottom:10px}.err{color:var(--red)}.ok{color:var(--accent)}
.hide{display:none}
button.link{background:none;color:var(--blue);padding:0;font-size:12px}
pre.log{margin:8px 0 0;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;max-height:360px;overflow:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.item.col{flex-wrap:wrap}.item.col>.det{flex:1 0 100%}
</style></head><body><main>
<h1>⚡ Actions Panel</h1>
<div id="msg">Loading…</div>
<div class="card hide" id="gate">
  <h2>Access code</h2>
  <div style="display:flex;gap:8px"><input id="code" type="password" placeholder="Enter access code"><button id="enter">Enter</button></div>
</div>
<div class="card hide" id="wfCard"><h2>Run an action</h2><select id="wf"></select><button class="big" id="runBtn">▶ Run action</button><div class="small" id="none"></div></div>
<div class="card hide" id="runCard"><h2>Recent runs &amp; logs</h2><div id="runs"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
let code=sessionStorage.getItem('code')||'';
const say=(t,c)=>{$('msg').textContent=t;$('msg').className=c||''};

async function api(path,opts={}){
  opts.headers={'x-access-code':code,...(opts.headers||{})};
  const r=await fetch(path,opts);
  const d=await r.json().catch(()=>({}));
  if(r.status===401){$('gate').classList.remove('hide');$('wfCard').classList.add('hide');$('runCard').classList.add('hide');throw new Error('Access code required')}
  if(!r.ok)throw new Error(d.error||('Server error '+r.status+' on '+path));
  return d;
}
$('enter').onclick=()=>{code=$('code').value.trim();sessionStorage.setItem('code',code);$('gate').classList.add('hide');say('');init()};

function st(r){
  if(r.status!=='completed')return['⏳ '+r.status.replace('_',' '),'progress'];
  return r.conclusion==='success'?['✅ success','success']:['❌ '+(r.conclusion||'done'),'failure'];
}

async function init(){
  try{
    say('Loading…');
    const d=await api('/api/panel?a=workflows');
    say('');
    $('wfCard').classList.remove('hide');$('runCard').classList.remove('hide');
    const sel=$('wf');sel.innerHTML='';
    d.workflows.forEach(w=>{const o=document.createElement('option');o.value=w.id;o.textContent=w.name;sel.appendChild(o)});
    sel.classList.toggle('hide',d.workflows.length<2);
    $('runBtn').disabled=!d.workflows.length;
    $('none').textContent=d.workflows.length?'':'No workflows found. Add a workflow file with "on: workflow_dispatch:" to the repo.';
    runs();
  }catch(e){say(e.message,'err')}
}

let lastRuns=[],openId=null,logText={},demoUrl={};
function fmtLogs(d){
  return d.jobs.map(j=>{
    let t='=== '+j.name+' ('+(j.conclusion||j.status)+') ===\n';
    if(j.log.trim())t+=j.log;
    else{
      t+='GitHub only releases full log text after the job finishes (or is cancelled). Live progress:\n\n';
      t+=j.steps.map(s=>(s.conclusion==='success'?'✅ ':s.status==='in_progress'?'⏳ ':s.conclusion?'❌ ':'… ')+s.name).join('\n');
      if(j.notes&&j.notes.length)t+='\n\nNotices:\n'+j.notes.map(n=>'📌 '+n).join('\n');
    }
    return t;
  }).join('\n\n')||'No jobs yet.';
}
async function fetchLogs(id){
  try{
    const d=await api('/api/panel?a=logs&run='+id);
    const t=fmtLogs(d),u=d.demo_url||'';
    if(logText[id]!==t||demoUrl[id]!==u){logText[id]=t;demoUrl[id]=u;render(true)}
  }catch(e){logText[id]='Could not load logs: '+e.message;render(true)}
}
function toggle(id){
  if(openId===id){openId=null;render();return}
  openId=id;logText[id]=logText[id]||'Loading logs…';render(true);fetchLogs(id);
}
function render(scroll){
  const box=$('runs');box.innerHTML='';
  if(!lastRuns.length)box.textContent='No runs yet.';
  lastRuns.forEach(x=>{
    const row=document.createElement('div');row.className='item col';
    const info=document.createElement('div');
    const a=document.createElement('div');a.textContent=(x.name||'Workflow')+' #'+x.run_number;
    const m=document.createElement('div');m.className='small';m.textContent=x.branch+' · '+new Date(x.created_at).toLocaleString();
    const l=document.createElement('button');l.className='link';l.textContent=openId===x.id?'Hide logs ▲':'View logs ▼';
    l.onclick=()=>toggle(x.id);
    info.append(a,m,l);
    const [t,c]=st(x),bd=document.createElement('span');bd.className='badge '+c;bd.textContent=t;
    row.append(info,bd);
    if(openId===x.id){
      const det=document.createElement('div');det.className='det';
      if(demoUrl[x.id]){
        const dl=document.createElement('a');dl.href=demoUrl[x.id];dl.target='_blank';dl.rel='noopener';
        dl.style.cssText='display:block;margin-top:8px;font-weight:600;word-break:break-all';
        dl.textContent='🌐 Open demo: '+demoUrl[x.id];det.appendChild(dl);
      }
      const pre=document.createElement('pre');pre.className='log';pre.textContent=logText[x.id]||'';
      det.appendChild(pre);row.appendChild(det);
      if(scroll)setTimeout(()=>{pre.scrollTop=pre.scrollHeight},0);
    }
    box.appendChild(row);
  });
}
async function runs(){
  try{
    const d=await api('/api/panel?a=runs');
    lastRuns=d.runs;
    const open=lastRuns.find(x=>x.id===openId);
    // keep the open log panel's scroll position while refreshing
    const pre=document.querySelector('pre.log'),top=pre?pre.scrollTop:0;
    render();
    const np=document.querySelector('pre.log');if(np)np.scrollTop=top;
    if(open&&open.status!=='completed')fetchLogs(open.id);
  }catch(e){}
}
setInterval(()=>{if(!document.hidden&&!$('wfCard').classList.contains('hide'))runs()},5000);
$('runBtn').onclick=async()=>{
  const b=$('runBtn'),sel=$('wf'),name=sel.options[sel.selectedIndex].text;
  b.disabled=true;b.textContent='Starting…';
  try{
    await api('/api/panel?a=run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({workflow_id:sel.value})});
    say('Triggered “'+name+'”. Waiting for run to appear…','ok');setTimeout(runs,2500);
  }catch(e){say(e.message,'err')}
  b.disabled=false;b.textContent='▶ Run action';
};
init();
</script></body></html>
